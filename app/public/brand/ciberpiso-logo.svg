<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="mascotBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B4332"/>
      <stop offset="1" stop-color="#2D6A4F"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1B4332" flood-opacity="0.20"/>
    </filter>
    <clipPath id="iconClip">
      <rect x="0" y="0" width="400" height="400" rx="96"/>
    </clipPath>
  </defs>

  <!-- Fondo -->
  <rect width="1600" height="900" fill="#F7F4EA"/>
  <circle cx="1500" cy="80" r="330" fill="#EFEAD9" opacity="0.65"/>
  <circle cx="90" cy="860" r="260" fill="#EFEAD9" opacity="0.55"/>
  <circle cx="1385" cy="790" r="110" fill="#E9E5D8" opacity="0.45"/>

  <!-- Mascota: granjero astronauta -->
  <g transform="translate(135,250)" filter="url(#softShadow)" clip-path="url(#iconClip)">
    <rect x="0" y="0" width="400" height="400" fill="url(#mascotBg)"/>

    <!-- Órbita y estrellas -->
    <circle cx="200" cy="200" r="158" stroke="#FACC15" stroke-width="3" opacity="0.16" stroke-dasharray="7 13"/>
    <circle cx="58" cy="72" r="4" fill="#FACC15" opacity="0.85"/>
    <circle cx="345" cy="95" r="3" fill="#F7F4EA" opacity="0.65"/>
    <circle cx="72" cy="305" r="2.5" fill="#95D5B2" opacity="0.8"/>
    <circle cx="150" cy="46" r="2.5" fill="#F7F4EA" opacity="0.55"/>

    <!-- Traje -->
    <path d="M45 400 C45 328 115 296 200 296 C285 296 355 328 355 400 Z" fill="#F7F4EA"/>
    <path d="M120 400 C120 344 154 320 200 320 C246 320 280 344 280 400 Z" fill="#2D6A4F"/>

    <!-- Tirantes -->
    <path d="M146 312 L171 366" stroke="#2D6A4F" stroke-width="21" stroke-linecap="round"/>
    <path d="M254 312 L229 366" stroke="#2D6A4F" stroke-width="21" stroke-linecap="round"/>

    <!-- Cuello -->
    <rect x="142" y="282" width="116" height="32" rx="16" fill="#D1D5DB"/>

    <!-- Casco -->
    <circle cx="200" cy="200" r="108" fill="#F7F4EA" stroke="#D1D5DB" stroke-width="6"/>
    <circle cx="200" cy="200" r="86" fill="#0B3D91"/>

    <!-- Cara -->
    <ellipse cx="200" cy="205" rx="50" ry="56" fill="#E8B48A"/>
    <path d="M155 180 Q200 151 245 180 Q200 168 155 180" fill="#6B4F3A"/>
    <circle cx="182" cy="198" r="5.5" fill="#1B4332"/>
    <circle cx="218" cy="198" r="5.5" fill="#1B4332"/>
    <path d="M180 222 Q200 238 220 222" stroke="#1B4332" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="168" cy="214" r="7" fill="#F4A6A6" opacity="0.45"/>
    <circle cx="232" cy="214" r="7" fill="#F4A6A6" opacity="0.45"/>

    <!-- Reflejo del visor -->
    <path d="M145 170 A62 62 0 0 1 205 132" stroke="#FFFFFF" stroke-width="8" opacity="0.25" fill="none" stroke-linecap="round"/>
    <circle cx="200" cy="200" r="94" stroke="#FACC15" stroke-width="4" fill="none" opacity="0.9"/>

    <!-- Sombrero de paja -->
    <ellipse cx="200" cy="102" rx="132" ry="28" fill="#FACC15"/>
    <path d="M148 102 C148 62 168 42 200 42 C232 42 252 62 252 102 Z" fill="#FACC15"/>
    <rect x="148" y="86" width="104" height="14" rx="6" fill="#D97706" opacity="0.9"/>
    <path d="M168 55 C180 48 192 46 200 46" stroke="#FDE68A" stroke-width="5" opacity="0.7" stroke-linecap="round" fill="none"/>

    <!-- Brazo y planta -->
    <path d="M282 332 C316 338 332 352 336 372" stroke="#F7F4EA" stroke-width="36" stroke-linecap="round" fill="none"/>
    <circle cx="336" cy="372" r="17" fill="#D1D5DB"/>
    <path d="M312 366 L350 366 L344 400 L318 400 Z" fill="#D97706"/>
    <path d="M331 366 C331 348 323 334 315 326" stroke="#2D6A4F" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M322 342 C306 338 296 324 300 312 C316 316 324 328 322 342 Z" fill="#95D5B2"/>
    <path d="M330 332 C344 326 354 312 352 300 C338 304 330 316 330 332 Z" fill="#74C69D"/>

    <!-- Insignia hoja -->
    <path d="M200 352 C214 358 218 370 200 380 C182 370 186 358 200 352 Z" fill="#FACC15"/>
    <path d="M200 358 L200 374" stroke="#2D6A4F" stroke-width="3" stroke-linecap="round"/>

    <!-- Punto satelital -->
    <circle cx="334" cy="118" r="8" fill="#0B3D91" stroke="#F7F4EA" stroke-width="3"/>
  </g>

  <!-- Texto -->
  <text x="625" y="382" font-family="Segoe UI Variable Display, Segoe UI, Arial, sans-serif" font-size="118" font-weight="800"
        letter-spacing="1.2" fill="#1B4332">CIBERPISO</text>
  <text x="630" y="442" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600"
        letter-spacing="7" fill="#588157">CROP ROTATION EXPLORER</text>
  <line x1="630" y1="474" x2="1325" y2="474" stroke="#FACC15" stroke-width="8" stroke-linecap="round"/>
  <text x="630" y="534" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="400"
        fill="#4B5563">Rotaciones que cuidan el suelo</text>
  <text x="630" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700"
        letter-spacing="4" fill="#0B3D91">SPACE APPS CHALLENGE 2026</text>

  <!-- Pie -->
  <text x="135" y="808" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600"
        letter-spacing="2.5" fill="#6B7280">POWER · SOILGRIDS · MODIS · SIGPAC</text>
  <text x="1465" y="808" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="16"
        font-weight="600" letter-spacing="2.5" fill="#6B7280">ANTEQUERA · MÁLAGA</text>
</svg>
