<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B4332"/>
      <stop offset="1" stop-color="#2D6A4F"/>
    </linearGradient>
    <linearGradient id="leafGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B7E4C7"/>
      <stop offset="1" stop-color="#74C69D"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1B4332" flood-opacity="0.18"/>
    </filter>
    <clipPath id="iconClip">
      <rect x="0" y="0" width="400" height="400" rx="88"/>
    </clipPath>
  </defs>

  <!-- Fondo -->
  <rect width="1600" height="900" fill="#F7F4EA"/>
  <circle cx="1500" cy="80" r="330" fill="#EFEAD9" opacity="0.65"/>
  <circle cx="90" cy="860" r="260" fill="#EFEAD9" opacity="0.55"/>
  <circle cx="1385" cy="790" r="110" fill="#E9E5D8" opacity="0.45"/>

  <!-- Icono -->
  <g transform="translate(135,250)" filter="url(#softShadow)">
    <rect x="0" y="0" width="400" height="400" rx="88" fill="url(#iconBg)"/>
    <g clip-path="url(#iconClip)">
      <!-- Surcos -->
      <path d="M40 306 C130 262 270 262 360 306" stroke="#74C69D" stroke-width="13" fill="none" opacity="0.48" stroke-linecap="round"/>
      <path d="M40 338 C130 294 270 294 360 338" stroke="#74C69D" stroke-width="13" fill="none" opacity="0.34" stroke-linecap="round"/>
      <path d="M40 370 C130 326 270 326 360 370" stroke="#74C69D" stroke-width="13" fill="none" opacity="0.22" stroke-linecap="round"/>

      <!-- Anillo de rotación: 300° + punta -->
      <circle cx="200" cy="200" r="96" stroke="#FACC15" stroke-width="18" fill="none"
              stroke-dasharray="502.65 100.53"/>
      <path d="M 265.3 126.9 L 240.5 129.9 L 255.5 103.9 Z" fill="#FACC15"/>

      <!-- Hoja -->
      <path d="M200 142 C258 158 268 220 200 258 C132 220 142 158 200 142 Z"
            fill="url(#leafGradient)"/>
      <path d="M200 154 L200 250" stroke="#1B4332" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
      <path d="M200 190 L236 174 M200 214 L164 198" stroke="#1B4332" stroke-width="5" stroke-linecap="round" opacity="0.45"/>

      <!-- Órbita / dato satelital -->
      <circle cx="306" cy="174" r="11" fill="#0B3D91" stroke="#F7F4EA" stroke-width="4"/>
    </g>
  </g>

  <!-- Texto -->
  <text x="625" y="382" font-family="Segoe UI Variable Display, Segoe UI, Arial, sans-serif" font-size="118" font-weight="800"
        letter-spacing="1.2" fill="#1B4332">CIBERPISO</text>
  <text x="630" y="442" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600"
        letter-spacing="7" fill="#588157">CROP ROTATION EXPLORER</text>
  <line x1="630" y1="474" x2="1325" y2="474" stroke="#FACC15" stroke-width="8" stroke-linecap="round"/>
  <text x="630" y="534" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="400"
        fill="#4B5563">Rotaciones que cuidan el suelo</text>
  <text x="630" y="594" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700"
        letter-spacing="4" fill="#0B3D91">NASA SPACE APPS CHALLENGE 2026</text>

  <!-- Pie -->
  <text x="135" y="808" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600"
        letter-spacing="2.5" fill="#6B7280">NASA POWER · SOILGRIDS · MODIS · SIGPAC</text>
  <text x="1465" y="808" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="16"
        font-weight="600" letter-spacing="2.5" fill="#6B7280">ANTEQUERA · MÁLAGA</text>
</svg>
